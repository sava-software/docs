services:
  docs:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/docs:ro
    working_dir: /docs
    user: node
    environment:
      HOME: /home/node
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /home/node:uid=1000,gid=1000,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 1g
